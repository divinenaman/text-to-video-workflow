<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baasha | Character Bible Dashboard</title>
    <link rel="stylesheet" href="character-bible/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
</head>

<body class="dashboard-layout">
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo">BAASHA</div>
            <div class="tagline">Character Studio</div>
        </div>

        <div class="sidebar-content">
            <div class="input-group">
                <label for="story">Story Script</label>
                <textarea id="story" placeholder="Enter story script here to dynamically generate characters..." rows="8">King Arthur, now aged and weary, stared at the map. His young squire, an eager boy named Thomas, polished the armor nervously.</textarea>
            </div>
            <div class="input-group">
                <label for="style_urls">Style Reference URL <span>(Optional)</span></label>
                <input type="text" id="style_urls" placeholder="e.g. https://example.com/style.jpg">
            </div>
            <button id="generate-btn" class="primary-btn">Generate Bible</button>
        </div>

        <div class="sidebar-footer">
            <p>&copy; 2026 Baasha AI</p>
        </div>
    </aside>

    <main class="main-content">
        <header class="content-header">
            <div class="current-topic-info">
                <span class="label">Current Project</span>
                <h2 id="display-topic">New Character Bible</h2>
            </div>
            <div class="header-actions">
                <div id="status-indicator" class="status-badge hidden">
                    <span class="loader-sm"></span>
                    <span id="status-text">Casting...</span>
                </div>
            </div>
        </header>

        <div id="welcome-state" class="empty-state">
            <div class="empty-icon">✧</div>
            <h3>Ready to cast?</h3>
            <p>Paste your script in the sidebar to extract characters and build a visual bible.</p>
        </div>

        <div id="results-area" class="hidden">
            <section class="comparison-section">
                <div class="section-header">
                    <h3>Character Breakdown</h3>
                </div>
                <div class="table-container">
                    <table id="comparison-table">
                        <thead>
                            <tr>
                                <th class="w-25">Character Name</th>
                                <th class="w-50">Visual DNA & Description</th>
                                <th class="w-25">Preview</th>
                            </tr>
                        </thead>
                        <tbody id="comparison-body">
                            <!-- Comparison rows will be injected here -->
                        </tbody>
                    </table>
                </div>
            </section>

            <section class="gallery-section">
                <div class="section-header">
                    <h3>Visual Bible</h3>
                </div>
                <div id="results-grid" class="results-grid">
                    <!-- Cards will be injected here -->
                </div>
            </section>
        </div>
    </main>

    <script src="character-bible/app.js"></script>
</body>

</html>
