[SERVICE]
    Flush         5
    Log_Level     info
    Daemon        off
    Parsers_File  parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020

# Read application logs from mounted directory
[INPUT]
    Name              tail
    Path              /app/logs/*.log
    Tag               app.logs
    Parser            json
    Refresh_Interval  10
    Skip_Long_Lines   On
    Buffer_Chunk_Size 32k
    Buffer_Max_Size   64k

# Read Docker container logs (optional - for container stdout/stderr)
[INPUT]
    Name              tail
    Path              /var/lib/docker/containers/*/*.log
    Tag               docker.logs
    Parser            docker
    Refresh_Interval  10
    Skip_Long_Lines   On
    Buffer_Chunk_Size 32k
    Buffer_Max_Size   64k

# Add metadata for all logs
[FILTER]
    Name        modify
    Match       app.logs
    Add         hostname ${HOSTNAME}
    Add         service pataka-api
    Add         region ${REGION}
    Add         environment ${ID}
    Add         logtype application

[FILTER]
    Name        modify
    Match       docker.logs
    Add         hostname ${HOSTNAME}
    Add         service pataka-docker
    Add         region ${REGION}
    Add         environment ${ID}
    Add         logtype container

# Add New Relic specific attributes
[FILTER]
    Name            modify
    Match           *
    Add             service.name pataka-api
    Add             service.version latest
    Add             host.name ${HOSTNAME}

# Ship to Linode Object Storage (S3-compatible) for long-term archival
# Ship to Linode Object Storage (S3-compatible) for long-term archival
[OUTPUT]
    Name               s3
    Match              *
    bucket             ${LINODE_BUCKET_NAME}
    region             us-east-1
    use_put_object     On
    total_file_size    100M
    upload_timeout     10m
    s3_key_format      /logs/${REGION}/%Y/%m/%d/%H/fluent-bit-%Y%m%d-%H%M%S-$UUID.log.gz
    store_dir          /tmp/fluent-bit-s3
    store_dir_limit_size 1G
    auto_retry_requests On
    send_content_md5    Off

# Ship to New Relic using official plugin (preferred method)
[OUTPUT]
    Name          newrelic
    Match         *
    licenseKey    ${NEW_RELIC_LICENSE_KEY}
    # It's good practice to specify the endpoint even if it's the default
    endpoint      https://log-api.newrelic.com/log/v1
    maxBufferSize 256000
    maxRecords    1024

